<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output</title>
</head>

<body>
    {% include 'navbar.html' %}

    <div class="container-fluid p-3 bg-primary">
        <h1 class="text-center mb-1 text-white">Scan image</h1>
        <hr class="opacity-100 border-white">
        <div class="row d-flex align-items-center justify-content-center p-2 gap-2">
            <form action="" method="post" enctype="multipart/form-data" class="col-md-4 p-4 bg-primary-subtle rounded">
                <div class="mb-3">
                    <label for="file" class="form-label">Select image</label>
                    <input type="file" class="form-control" name="imagefile" id="file">
                </div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-danger">Submit</button>
                </div>
            </form>
            <div class="col-md-7 bg-primary-subtle p-4 rounded" style="min-height: 250px;">
                <h2 class="text-center">Image for detection</h2>
                <hr class="opacity-75">
                {% if image %}
                <div class="d-flex justify-content-center">
                    <img src="{{ image }}" alt="" class="img-fluid" style="max-height: 350px;">
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <div class="container-fluid text-light p-4 bg-primary" style="min-height: 250px;">
        <h2 class="text-center fw-bold mt-3">Prediction</h2>
        <hr class="opacity-100">
        {% if result %}
        <h3><b>Result - </b> Image scan is showing <strong>{{result}}</strong></h3>
        {% endif %}
    </div>

    {% include 'footer.html' %}


</body>

</html>
